name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.13"

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      worker: ${{ steps.filter.outputs.worker }}
      relay: ${{ steps.filter.outputs.relay }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'supabase/**'
              - '.github/workflows/**'
              - 'package.json'
            worker:
              - 'apps/api-worker/**'
              - 'supabase/**'
              - '.github/workflows/**'
              - 'package.json'
            relay:
              - 'apps/relay/**'
              - '.github/workflows/**'

  web:
    name: Web validation
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci.example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  worker:
    name: Worker validation
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.worker == 'true' }}
    runs-on: ubuntu-latest
    # The `secrets` context is not allowed in step-level `if:` expressions
    # (Actions rejects the whole workflow file with "Unrecognized named-value:
    # 'secrets'"). Hoist the credentials into job env and test `env.*` instead.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/api-worker
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Render CI worker config
        run: npm run render:production-config
        env:
          WORKER_ALLOWED_ORIGINS: https://ci.example.com,http://localhost:5173
          WORKER_ANTHROPIC_MODEL: claude-sonnet-4-20250514
          WORKER_WORKERS_AI_MODEL: "@cf/openai/gpt-oss-20b"
          WORKER_AI_GATEWAY_ID: coachroyale-free
          WORKER_AI_EVENTS_DATASET: coachroyale_ai_events_ci
          WORKER_RELAY_BASE_URL: https://relay.ci.example.com
          WORKER_SUPABASE_URL: https://ci.example.supabase.co
          WORKER_LEMONSQUEEZY_STORE_ID: ci-store-id
          WORKER_LEMONSQUEEZY_VARIANT_ID: ci-variant-id
          WORKER_APP_BASE_URL: https://ci.example.com
          WORKER_STRUCTURED_LOGS_ENABLED: "false"

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Dry-run deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler deploy --dry-run --outdir dist -c .wrangler/production.toml

      - name: Fail dry-run when Cloudflare credentials are missing on production-targeted runs
        if: >-
          ${{
            github.event_name != 'pull_request' &&
            (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '')
          }}
        run: |
          echo "::error title=Missing Cloudflare credentials::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be available for non-PR worker validation runs."
          exit 1

      - name: Skip dry-run without Cloudflare credentials on pull requests
        if: >-
          ${{
            github.event_name == 'pull_request' &&
            (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '')
          }}
        run: echo "Skipping Wrangler dry-run because Cloudflare credentials are unavailable in this context."

  relay:
    name: Relay validation
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.relay == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/relay
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/relay/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: python -m ruff check app tests

      - name: Pytest
        run: python -m pytest -q

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Scan tracked files for committed secrets
        run: npm run secret:scan

  ci:
    name: CI gate
    needs:
      - changes
      - web
      - worker
      - relay
      - security
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected validations
        run: |
          set -e
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.web.result }}" \
            "${{ needs.worker.result }}" \
            "${{ needs.relay.result }}" \
            "${{ needs.security.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required job failed or was cancelled: $result"
              exit 1
            fi
          done
          echo "Selected validation jobs passed or were skipped."

  deploy-web:
    name: Deploy web
    needs:
      - changes
      - web
      - ci
    if: >-
      ${{
        github.event_name != 'pull_request' &&
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true')
      }}
    runs-on: ubuntu-latest
    environment: production-web
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate production web environment
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          WEB_SMOKE_URL: ${{ vars.WEB_SMOKE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -eu
          for required_var in CLOUDFLARE_PAGES_PROJECT WEB_SMOKE_URL VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [ -z "${!required_var}" ]; then
              echo "::error title=Missing ${required_var}::${required_var} must be set in the production-web GitHub environment."
              exit 1
            fi
          done

          if [ "$VITE_SUPABASE_URL" = "https://your-project.supabase.co" ] || [ "$VITE_SUPABASE_ANON_KEY" = "your-anon-key" ]; then
            echo "::error title=Template Supabase config rejected::Production deployments must not use template Supabase values."
            exit 1
          fi

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_AUTH_REDIRECT_URL: ${{ vars.VITE_AUTH_REDIRECT_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}

      - name: Smoke check deployed web app
        env:
          WEB_SMOKE_URL: ${{ vars.WEB_SMOKE_URL }}
        run: |
          set -eu
          curl --fail --silent --show-error --location \
            --retry 5 \
            --retry-delay 5 \
            --max-time 20 \
            --output /dev/null \
            "$WEB_SMOKE_URL"

  deploy-worker:
    name: Deploy worker
    needs:
      - changes
      - worker
      - ci
    if: >-
      ${{
        github.event_name != 'pull_request' &&
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'workflow_dispatch' || needs.changes.outputs.worker == 'true')
      }}
    runs-on: ubuntu-latest
    environment: production-worker
    defaults:
      run:
        working-directory: apps/api-worker
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Render production worker config
        run: npm run render:production-config
        env:
          WORKER_ALLOWED_ORIGINS: ${{ vars.WORKER_ALLOWED_ORIGINS }}
          WORKER_ANTHROPIC_MODEL: ${{ vars.WORKER_ANTHROPIC_MODEL }}
          WORKER_WORKERS_AI_MODEL: ${{ vars.WORKER_WORKERS_AI_MODEL }}
          WORKER_AI_GATEWAY_ID: ${{ vars.WORKER_AI_GATEWAY_ID }}
          WORKER_AI_EVENTS_DATASET: ${{ vars.WORKER_AI_EVENTS_DATASET }}
          WORKER_RELAY_BASE_URL: ${{ vars.WORKER_RELAY_BASE_URL }}
          WORKER_SUPABASE_URL: ${{ vars.WORKER_SUPABASE_URL }}
          WORKER_LEMONSQUEEZY_STORE_ID: ${{ vars.WORKER_LEMONSQUEEZY_STORE_ID }}
          WORKER_LEMONSQUEEZY_VARIANT_ID: ${{ vars.WORKER_LEMONSQUEEZY_VARIANT_ID }}
          WORKER_APP_BASE_URL: ${{ vars.WORKER_APP_BASE_URL }}
          WORKER_STRUCTURED_LOGS_ENABLED: ${{ vars.WORKER_STRUCTURED_LOGS_ENABLED }}

      - name: Verify production worker secrets
        run: npm run verify:remote-secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Validate worker smoke target
        env:
          WORKER_SMOKE_URL: ${{ vars.WORKER_SMOKE_URL }}
        run: |
          set -eu
          if [ -z "$WORKER_SMOKE_URL" ]; then
            echo "::error title=Missing WORKER_SMOKE_URL::WORKER_SMOKE_URL must be set in the production-worker GitHub environment."
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy -c .wrangler/production.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke check deployed worker
        env:
          WORKER_SMOKE_URL: ${{ vars.WORKER_SMOKE_URL }}
        run: |
          set -eu
          curl --fail --silent --show-error --location \
            --retry 5 \
            --retry-delay 5 \
            --max-time 20 \
            --output /dev/null \
            "$WORKER_SMOKE_URL"
