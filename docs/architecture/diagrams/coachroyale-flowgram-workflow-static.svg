    <path d="M1136 294H1194M1144 313H1186M1154 332H1176" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
    <text class="icon-label" x="1165" y="352" text-anchor="middle">ROUTER</text>
    <circle class="handle" cx="1110" cy="313" r="8"/>
