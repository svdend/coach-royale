  <rect class="legend-box" x="92" y="782" width="974" height="40" rx="6"/>
  <text class="legend-text" x="116" y="807">Provider routing: anonymous → deterministic fallback, free → Workers AI, pro → Anthropic, operator with custom config → self-hosted fine-tuned model. BYOK remains browser-direct.</text>
