  <path class="line" marker-end="url(#arrow)" d="M1220 332H1282C1314 332 1314 444 1346 444"/>
  <path class="muted-line" marker-end="url(#arrow-muted)" d="M752 332H790C820 332 820 604 1346 604"/>
  <text class="true" x="1280" y="156">pro</text>
  <text class="true" x="1280" y="308">free</text>
  <text class="false" x="1242" y="460">operator</text>

  <path class="line" marker-end="url(#arrow)" d="M986 332H1028C1058 332 1058 574 1108 574"/>
  <path class="line" marker-end="url(#arrow)" d="M986 332H1028C1058 332 1058 686 1108 686"/>
  <path class="line" marker-end="url(#arrow)" d="M752 332H794C824 332 824 574 874 574"/>
  <path class="line" marker-end="url(#arrow)" d="M752 332H794C824 332 824 686 874 686"/>
  <path class="muted-line" marker-end="url(#arrow-muted)" d="M284 332H330C360 332 360 574 406 574"/>

