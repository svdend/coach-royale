<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CoachRoyale static workflow flowgram</title>
  <desc id="desc">A static workflow-style flowgram for CoachRoyale showing trigger, static hosting, BFF routing, Supercell relay, Supabase data, AI providers, and billing paths.</desc>
  <defs>
    <style>
      .app-bg { fill: #f8fafc; }
      .rail { fill: #ffffff; stroke: #d8dee8; }
      .topbar { fill: #ffffff; stroke: #d8dee8; }
      .canvas { fill: #fbfdff; }
      .grid-dot { fill: #d6deeb; }
      .title { fill: #1f2937; font: 600 16px Inter, ui-sans-serif, system-ui, sans-serif; }
      .top-small { fill: #64748b; font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; }
      .node { fill: #ffffff; stroke: #9aa6b2; stroke-width: 2; }
      .node-title { fill: #1f2937; font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif; }
      .node-sub { fill: #718096; font: 500 10px Inter, ui-sans-serif, system-ui, sans-serif; }
      .icon-label { fill: #334155; font: 800 10px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .02em; }
      .note { fill: #64748b; font: 600 11px Inter, ui-sans-serif, system-ui, sans-serif; }
      .status { fill: #94a3b8; font: 500 11px Inter, ui-sans-serif, system-ui, sans-serif; }
      .handle { fill: #7a828c; }
      .plus { fill: #ffffff; stroke: #9aa6b2; stroke-width: 1.5; }
      .line { fill: none; stroke: #6b7280; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .muted-line { fill: none; stroke: #94a3b8; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 7; }
      .true { fill: #16a34a; font: 700 9px Inter, ui-sans-serif, system-ui, sans-serif; }
      .false { fill: #ef4444; font: 700 9px Inter, ui-sans-serif, system-ui, sans-serif; }
      .legend-box { fill: rgba(255,255,255,.92); stroke: #d8dee8; }
      .legend-text { fill: #475569; font: 600 11px Inter, ui-sans-serif, system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-muted" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
    <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect class="app-bg" width="1600" height="900"/>
  <rect class="topbar" x="0" y="0" width="1600" height="56"/>
  <rect class="rail" x="0" y="0" width="56" height="900"/>

  <g transform="translate(16 18)" stroke="#ff3366" stroke-width="2.2" fill="none">
    <circle cx="0" cy="6" r="3" fill="#ffffff"/>
    <circle cx="12" cy="0" r="3" fill="#ffffff"/>
    <circle cx="24" cy="8" r="3" fill="#ffffff"/>
    <path d="M3 6H9M15 2L21 6"/>
  </g>
  <text class="title" x="90" y="33">CoachRoyale Runtime Flowgram</text>
  <text class="top-small" x="382" y="33">static architecture view · code-derived May 2026</text>
  <text class="top-small" x="1210" y="33">Legend: solid = managed path · dashed = optional path</text>

  <g transform="translate(16 78)" fill="#64748b" style="font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif;">
    <text x="0" y="0">⌘</text>
    <text x="0" y="56">☁</text>
    <text x="0" y="112">◆</text>
    <text x="0" y="168">∿</text>
    <text x="0" y="224">☰</text>
    <text x="0" y="414">⚙</text>
    <text x="0" y="470">?</text>
  </g>

  <rect class="canvas" x="56" y="56" width="1544" height="844"/>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
    <circle class="grid-dot" cx="2" cy="2" r="1.15"/>
  </pattern>
  <rect x="56" y="56" width="1544" height="844" fill="url(#dots)"/>

