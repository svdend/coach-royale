    <path d="M1384 578H1372V626H1384M1422 578H1434V626H1422" fill="none" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
    <text class="icon-label" x="1403" y="640" text-anchor="middle">BYOK</text>
    <circle class="handle" cx="1348" cy="603" r="8"/>
    <text class="node-title" x="1403" y="686" text-anchor="middle">Browser BYOK</text>
