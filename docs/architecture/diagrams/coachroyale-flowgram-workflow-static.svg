    <circle cx="1163" cy="550" r="28" fill="#16a34a"/>
    <image href="supabase.svg" x="1139" y="526" width="48" height="48"/>
    <text class="icon-label" x="1163" y="594" text-anchor="middle">SUPABASE</text>
    <circle class="handle" cx="1110" cy="555" r="8"/>
    <text class="node-title" x="1165" y="638" text-anchor="middle">Supabase</text>
    <text class="node-sub" x="1165" y="656" text-anchor="middle">Auth + Postgres</text>
  </g>

  <g filter="url(#node-shadow)">
    <rect class="node" x="876" y="500" width="110" height="110" rx="9"/>
    <circle cx="931" cy="550" r="28" fill="#059669"/>
