<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">CoachRoyale product flowgram</title>
  <desc id="desc">A code-derived product flowgram showing browser, Cloudflare, Worker modules, Supabase, model providers, billing, and Supercell egress.</desc>
  <defs>
    <style>
      .bg { fill: #07111f; }
      .title { fill: #f8fafc; font: 700 34px Inter, ui-sans-serif, system-ui, sans-serif; }
      .subtitle { fill: #94a3b8; font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif; }
      .lane-title { fill: #cbd5e1; font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; }
      .node-title { fill: #f8fafc; font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; }
      .node-sub { fill: #cbd5e1; font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; }
      .edge-label { fill: #e2e8f0; font: 700 11px Inter, ui-sans-serif, system-ui, sans-serif; }
      .legend { fill: #cbd5e1; font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; }
      .small { fill: #94a3b8; font: 500 11px Inter, ui-sans-serif, system-ui, sans-serif; }
      .lane { fill: rgba(15, 23, 42, .72); stroke: rgba(148, 163, 184, .22); stroke-width: 1.5; }
      .browser { fill: #10233d; stroke: #38bdf8; }
      .cf { fill: #3a1c0b; stroke: #f97316; }
      .module { fill: #241a12; stroke: #fb923c; }
      .data { fill: #062d1a; stroke: #22c55e; }
      .ai { fill: #26134f; stroke: #a78bfa; }
      .custom { fill: #0f3d3b; stroke: #2dd4bf; }
      .billing { fill: #38260a; stroke: #facc15; }
      .relay { fill: #3a1024; stroke: #f472b6; }
      .actor { fill: #0f2a54; stroke: #60a5fa; }
      .node { stroke-width: 2; rx: 12; }
      .brand-icon { opacity: .94; }
      .flow-api { stroke: #f97316; }
      .flow-static { stroke: #38bdf8; }
      .flow-data { stroke: #22c55e; }
      .flow-ai { stroke: #a78bfa; }
      .flow-custom { stroke: #2dd4bf; }
      .flow-bill { stroke: #facc15; }
      .flow-relay { stroke: #f472b6; }
      .flow-byok { stroke: #818cf8; stroke-dasharray: 8 7; }
      .flow-telemetry { stroke: #94a3b8; stroke-dasharray: 5 6; }
      .edge { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .edge-hot { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .edge-thin { fill: none; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker markerUnits="userSpaceOnUse" id="arrow-api" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#f97316"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="arrow-static" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#38bdf8"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="arrow-data" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#22c55e"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="arrow-ai" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#a78bfa"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="arrow-custom" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#2dd4bf"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="arrow-bill" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#facc15"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="arrow-relay" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#f472b6"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="arrow-byok" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 Z" fill="#818cf8"/>
    </marker>
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity=".33"/>
    </filter>
  </defs>

  <rect class="bg" width="1600" height="1050"/>
  <path d="M0 0H1600V1050H0Z" fill="url(#none)"/>
  <g opacity=".06" stroke="#f8fafc" stroke-width="1">
    <path d="M0 160H1600M0 260H1600M0 360H1600M0 460H1600M0 560H1600M0 660H1600M0 760H1600M0 860H1600M0 960H1600"/>
    <path d="M100 0V1050M200 0V1050M300 0V1050M400 0V1050M500 0V1050M600 0V1050M700 0V1050M800 0V1050M900 0V1050M1000 0V1050M1100 0V1050M1200 0V1050M1300 0V1050M1400 0V1050M1500 0V1050"/>
  </g>

  <text class="title" x="64" y="62">CoachRoyale product flowgram</text>
  <text class="subtitle" x="64" y="92">Code-derived flow across browser, Cloudflare BFF, Supabase, AI lanes, billing, and static-IP Supercell relay.</text>

