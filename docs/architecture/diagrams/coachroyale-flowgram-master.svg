    <image class="brand-icon" href="cloudflare.svg" x="55" y="421" width="34" height="34"/>
    <text class="node-title" x="151" y="427" text-anchor="middle">Workers AI</text>
    <text class="node-sub" x="151" y="449" text-anchor="middle">AI binding</text>
    <text class="node-sub" x="151" y="466" text-anchor="middle">optional Gateway</text>

