    <circle cx="931" cy="308" r="28" fill="#f97316"/>
    <image href="cloudflare.svg" x="907" y="284" width="48" height="48"/>
    <circle class="handle" cx="876" cy="313" r="8"/>
    <circle class="handle" cx="986" cy="313" r="8"/>
    <text class="node-title" x="931" y="396" text-anchor="middle">Worker BFF</text>
    <text class="node-sub" x="931" y="414" text-anchor="middle">Hono routes + auth</text>
