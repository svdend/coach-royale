  <path class="line" marker-end="url(#arrow)" d="M284 332H406"/>
  <path class="line" marker-end="url(#arrow)" d="M518 332H640"/>
  <path class="line" marker-end="url(#arrow)" d="M752 332H874"/>
  <path class="line" marker-end="url(#arrow)" d="M986 332H1108"/>

  <path class="line" marker-end="url(#arrow)" d="M1220 332H1290C1320 332 1320 182 1352 182"/>
  <path class="line" marker-end="url(#arrow)" d="M1220 332H1290C1320 332 1320 360 1352 360"/>
  <path class="line" marker-end="url(#arrow)" d="M1220 332H1290C1320 332 1320 540 1352 540"/>
