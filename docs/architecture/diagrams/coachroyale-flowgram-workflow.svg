  <g>
    <rect class="badge" x="92" y="782" width="88" height="30" rx="4"/><text class="badge-text" x="136" y="802" text-anchor="middle">fit</text>
    <rect class="badge" x="190" y="782" width="88" height="30" rx="4"/><text class="badge-text" x="234" y="802" text-anchor="middle">zoom in</text>
    <rect class="badge" x="288" y="782" width="88" height="30" rx="4"/><text class="badge-text" x="332" y="802" text-anchor="middle">zoom out</text>
    <rect class="badge" x="386" y="782" width="88" height="30" rx="4"/><text class="badge-text" x="430" y="802" text-anchor="middle">undo</text>
