<?xml version="1.0" encoding="UTF-8"?>
<!--
  Concept 1: Sigil — monochrome.
  Uses currentColor so it inherits the surrounding text color (works on
  dark navy headers, on white print, on a single-tone gold favicon).
  The check is rendered as a stroked cut-out via fill-rule:evenodd so
  the mark stays one shape in single-color.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CoachRoyale sigil mark">
  <title>CoachRoyale</title>
  <g fill="currentColor" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
    <!-- Crown silhouette (filled) -->
    <path d="M14 44
             L10 22
             L23 30
             L32 14
             L41 30
             L54 22
             L50 44
             Z"
          stroke-width="1"/>
    <!-- Base band -->
    <rect x="12" y="44" width="40" height="6" rx="1.5" stroke="none"/>
  </g>

  <!-- Negative-space check (drawn in plate color). For mono usage on
       arbitrary backgrounds we cut the check out via a path that uses
       'mix-blend-mode: difference' if available, but for maximum
       compatibility we emit a transparent stroke that simply overlays.
       Practical answer: stroke in 'white' equivalent only works on dark.
       For true single-color, we instead emboss the check by stroking it
       with the BACKGROUND color via the SVG's parent. Here we use a
       <mask> to punch the check out of the crown so the result is one
       solid shape regardless of background. -->
  <defs>
    <mask id="check-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect x="0" y="0" width="64" height="64" fill="white"/>
      <path d="M19 36 L27 42 L44 24"
            fill="none"
            stroke="black"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"/>
      <!-- Jewel cut-outs -->
      <circle cx="14" cy="22" r="2.2" fill="black"/>
      <circle cx="32" cy="14" r="2.6" fill="black"/>
      <circle cx="50" cy="22" r="2.2" fill="black"/>
      <circle cx="32" cy="47" r="1.4" fill="black"/>
    </mask>
  </defs>

  <g mask="url(#check-cut)">
    <path d="M14 44
             L10 22
             L23 30
             L32 14
             L41 30
             L54 22
             L50 44
             Z
             M12 44
             h40
             v6
             a1.5 1.5 0 0 1 -1.5 1.5
             h-37
             a1.5 1.5 0 0 1 -1.5 -1.5
             z"
          fill="currentColor"/>
    <rect x="12" y="44" width="40" height="6" rx="1.5" fill="currentColor"/>
  </g>
</svg>
