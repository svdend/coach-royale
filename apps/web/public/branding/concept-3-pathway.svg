<?xml version="1.0" encoding="UTF-8"?>
<!--
  Concept 3: Pathway
  An abstract crown whose three peaks are formed by an upward-trending
  trend line. It reads simultaneously as a crown and as a chart of
  improving performance over time — the literal product promise.
  No literal "graph" axes, just the arc of an ascent rendered in a
  crown silhouette. Strong at small sizes because it's a single
  continuous line plus three peak-jewels.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CoachRoyale pathway mark">
  <title>CoachRoyale</title>
  <!-- Plate: dark navy rounded square -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="#0a0a23"/>

  <!-- Subtle baseline (the "ground" the player rises from) -->
  <line x1="10" y1="50" x2="54" y2="50"
        stroke="#1a1a3a" stroke-width="2" stroke-linecap="round"/>

  <!-- The trend-line crown: one continuous polyline.
       Path: start low-left, rise to peak 1, dip to valley 1,
       rise higher to peak 2 (center, the goal), dip to valley 2,
       rise highest to peak 3 (achieved). Each peak is taller than
       the last, giving the crown an asymmetric "still climbing" feel.
       Stroke is fat for legibility at favicon size. -->
  <path d="M10 50
           L18 30
           L24 38
           L32 18
           L40 28
           L46 12
           L54 50"
        fill="none"
        stroke="#f0c544"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Crown jewels at each peak. Center is purple to brand-tie. -->
  <circle cx="18" cy="30" r="3" fill="#d4a017" stroke="#0a0a23" stroke-width="1.5"/>
  <circle cx="32" cy="18" r="3.5" fill="#6b46c1" stroke="#0a0a23" stroke-width="1.5"/>
  <circle cx="46" cy="12" r="3" fill="#d4a017" stroke="#0a0a23" stroke-width="1.5"/>

  <!-- Tiny ascent arrow on the right tail to reinforce direction.
       Disappears at 16px but adds clarity at 32+. -->
  <path d="M50 16 L46 12 L46 16"
        fill="none" stroke="#0a0a23" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- Base band / pedestal: a thin gold line under the baseline -->
  <line x1="14" y1="54" x2="50" y2="54"
        stroke="#d4a017" stroke-width="2.5" stroke-linecap="round"/>
</svg>
