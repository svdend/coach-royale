<?xml version="1.0" encoding="UTF-8"?>
<!--
  Concept 2: Sentinel
  A small crown perched atop a magnifying lens. The lens reads as
  analysis / review; the crown signals the Royale category and the
  premium positioning. The handle of the lens is angled at 45 degrees
  so the silhouette echoes a scepter. The lens center is empty so it
  reads cleanly at 16px (a circle plus a small crown is a very robust
  silhouette at small sizes).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CoachRoyale sentinel mark">
  <title>CoachRoyale</title>
  <!-- No background plate on this one: the lens IS the silhouette.
       This makes it stronger as a sticker / favicon on top of any
       header color. -->

  <!-- Magnifier handle (scepter-like): drawn first so the lens overlaps it -->
  <rect x="40" y="40"
        width="6" height="22"
        rx="3"
        transform="rotate(45 43 51)"
        fill="#d4a017"/>
  <!-- Handle highlight stripe -->
  <rect x="42" y="40"
        width="2" height="22"
        transform="rotate(45 43 51)"
        fill="#f0c544"/>

  <!-- Lens ring (analysis) -->
  <circle cx="28" cy="36" r="16" fill="#0a0a23" stroke="#f0c544" stroke-width="4"/>
  <!-- Inner lens highlight, top-left arc, suggests glass -->
  <path d="M18 28 A12 12 0 0 1 28 22"
        fill="none" stroke="#f0c544" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Crown perched on top of the lens. Three peaks, scaled small,
       sits with its base at the top of the lens ring. -->
  <g transform="translate(16 8)">
    <path d="M0 16
             L-2 4
             L6 8
             L12 0
             L18 8
             L26 4
             L24 16
             Z"
          fill="#f0c544"
          stroke="#0a0a23"
          stroke-width="1.5"
          stroke-linejoin="round"/>
    <!-- Jewel on center peak -->
    <circle cx="12" cy="2" r="2" fill="#6b46c1"/>
    <!-- Side jewels -->
    <circle cx="0" cy="6" r="1.2" fill="#6b46c1"/>
    <circle cx="24" cy="6" r="1.2" fill="#6b46c1"/>
    <!-- Base band -->
    <rect x="-1" y="16" width="26" height="3" rx="1" fill="#d4a017"/>
  </g>

  <!-- Up-arrow inside the lens: a tiny chevron suggesting "improve",
       reinforcing coaching meaning at larger sizes; it disappears
       gracefully at favicon scale. -->
  <path d="M22 40 L28 32 L34 40"
        fill="none" stroke="#f0c544" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="28" y1="32" x2="28" y2="44"
        stroke="#f0c544" stroke-width="3" stroke-linecap="round"/>
</svg>
