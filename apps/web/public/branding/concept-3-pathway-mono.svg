<?xml version="1.0" encoding="UTF-8"?>
<!--
  Concept 3: Pathway — monochrome.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CoachRoyale pathway mark">
  <title>CoachRoyale</title>
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trend-line crown -->
    <path d="M10 50 L18 30 L24 38 L32 18 L40 28 L46 12 L54 50"
          stroke-width="4.5"/>
    <!-- Pedestal -->
    <line x1="14" y1="54" x2="50" y2="54" stroke-width="2.5"/>
    <!-- Jewels (filled dots) -->
    <circle cx="18" cy="30" r="2.5" fill="currentColor" stroke="none"/>
    <circle cx="32" cy="18" r="3" fill="currentColor" stroke="none"/>
    <circle cx="46" cy="12" r="2.5" fill="currentColor" stroke="none"/>
  </g>
</svg>
